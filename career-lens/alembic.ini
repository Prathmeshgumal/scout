# Alembic owns the schema. `career-lens migrate` is the supported way
# to apply migrations; this file exists so that
# `alembic revision --autogenerate` works when adding one.
#
# No URL here deliberately: it comes from CAREER_LENS_MIGRATE_DATABASE_URL via
# migrations/env.py, so exactly one place names the database.
[alembic]
script_location = src/career_lens/migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

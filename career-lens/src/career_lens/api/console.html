<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>career-lens console</title>
<style>
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0 auto; max-width: 1100px; padding: 16px; color: #1c1c1c; background: #fff; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 15px; margin: 24px 0 8px; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid #eee; vertical-align: top; }
  th { font-weight: 600; color: #555; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 8px 0; }
  label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #555; }
  input, select, button { font: inherit; padding: 4px 6px; }
  td button { margin: 0 4px 4px 0; }
  pre { background: #f5f5f5; padding: 8px; overflow: auto; max-height: 420px; white-space: pre-wrap; word-break: break-word; }
  .error { color: #a40000; min-height: 1.4em; }
  .scroll { overflow-x: auto; }
  [hidden] { display: none; }
</style>
</head>
<body>
<h1>career-lens console</h1>
<div id="message" class="error" role="status"></div>

<form id="key-form">
  <label>API key <input id="key" type="password" autocomplete="off" size="50" required></label>
  <button>Connect</button>
  <button type="button" id="refresh">Refresh</button>
</form>

<div id="main" hidden>
<h2>Workers</h2>
<div class="scroll"><table id="workers"></table></div>

<h2>LinkedIn accounts</h2>
<form id="account-form">
  <label>Label <input name="label" required></label>
  <label>Username <input name="username" autocomplete="off" required></label>
  <label>Password <input name="password" type="password" autocomplete="new-password" required></label>
  <label>Profile URL <input name="profile_url"></label>
  <label>Scrapes per 24h <input name="max_attempts_24h" type="number" min="1" value="20" required></label>
  <label>Seconds between <input name="min_interval_seconds" type="number" min="0" value="300" required></label>
  <button>Add account</button>
</form>
<div class="scroll"><table id="accounts"></table></div>
<form id="password-form">
  <label>Account <select name="account" required></select></label>
  <label>New password <input name="password" type="password" autocomplete="new-password" required></label>
  <button>Change password</button>
</form>

<h2>Working hours</h2>
<form id="shift-form">
  <label>Account <select name="account" required></select></label>
  <label>Timezone <input name="timezone" value="Asia/Kolkata" required></label>
  <label>Start <input name="start" type="time" value="10:00" required></label>
  <label>End <input name="end" type="time" value="19:00" required></label>
  <label>Lunch minutes <input name="lunch" type="number" min="0" value="45" required></label>
  <label>Saturday and Sunday too <input name="weekend" type="checkbox"></label>
  <button>Save hours</button>
</form>

<h2>Try it</h2>
<form id="try-form">
  <label>Kind
    <select name="kind">
      <option value="google-search">Google search</option>
      <option value="linkedin-company">LinkedIn company</option>
      <option value="linkedin-individual">LinkedIn person</option>
      <option value="url">Single page</option>
    </select>
  </label>
  <label>Query or URL <input name="target" size="50" required></label>
  <label>LinkedIn sections, comma separated <input name="sections" placeholder="about, jobs"></label>
  <button>Submit</button>
</form>

<h2>Recent requests</h2>
<div class="scroll"><table id="requests"></table></div>
<pre id="detail" hidden></pre>
</div>

<script>
"use strict";
// The key stays in this variable only, so reloading the page forgets it.
let apiKey = "";
const $ = (id) => document.getElementById(id);

function say(text) { $("message").textContent = text || ""; }

async function call(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: { "Authorization": "Bearer " + apiKey,
               ...(body === undefined ? {} : { "Content-Type": "application/json" }) },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await response.json().catch(() => null);
  if (!response.ok) {
    const detail = data && data.detail;
    throw new Error(response.status + ": " + (typeof detail === "string" ? detail : JSON.stringify(detail)));
  }
  return data;
}

function attempt(action) {
  return async (...args) => {
    say("");
    try { await action(...args); } catch (error) { say(error.message); }
  };
}

function cell(row, content) {
  const td = row.insertCell();
  if (content instanceof Node) td.append(content);
  else td.textContent = content === null || content === undefined ? "" : String(content);
  return td;
}

function button(text, action) {
  const item = document.createElement("button");
  item.type = "button";
  item.textContent = text;
  item.addEventListener("click", attempt(action));
  return item;
}

function group(...items) {
  const box = document.createElement("span");
  box.append(...items);
  return box;
}

function table(id, headings) {
  const element = $(id);
  element.replaceChildren();
  const head = element.createTHead().insertRow();
  for (const heading of headings) {
    const th = document.createElement("th");
    th.textContent = heading;
    head.append(th);
  }
  return element.createTBody();
}

function command(assignment, name) {
  return button(name, async () => {
    await call("POST", "/console/api/assignments/" + assignment.id + "/" + name);
    await refresh();
  });
}

function renderWorkers(workers, accounts) {
  const body = table("workers", ["Worker", "Live", "Health", "Account", "Assign", "Google"]);
  for (const worker of workers) {
    const row = body.insertRow();
    cell(row, worker.supervisor + " / " + worker.name);
    cell(row, worker.live ? "yes" : "no");
    cell(row, worker.health + (worker.health_detail ? ": " + worker.health_detail : ""));
    cell(row, worker.assignment ? worker.assignment.state : "none");
    const picker = document.createElement("select");
    for (const account of accounts.filter((item) => !item.assignment)) {
      picker.add(new Option(account.label, account.id));
    }
    cell(row, worker.assignment || !picker.options.length ? "" : group(picker, button("Assign", async () => {
      await call("POST", "/console/api/workers/" + worker.id + "/assignments", { account_id: picker.value });
      await refresh();
    })));
    const google = worker.google;
    const on = Boolean(google && google.policy.enabled);
    cell(row, group(
      document.createTextNode(google ? (on ? "on, " : "off, ") + google.usage.searches_24h + "/" + google.policy.max_searches_24h + " today " : "unknown "),
      button(on ? "Turn off" : "Turn on", async () => {
        const change = on ? { enabled: false } : { enabled: true, max_searches_hour: 20, max_searches_24h: 100 };
        await call("PATCH", "/console/api/workers/" + worker.id + "/google-policy", change);
        await refresh();
      })));
  }
}

function hours(schedule) {
  if (!schedule) return "not set";
  const day = schedule.days.find((item) => item.working);
  return (schedule.enabled ? "" : "off: ") + (day ? day.start_local + " to " + day.end_local + " " : "") + schedule.timezone;
}

function renderAccounts(accounts) {
  const body = table("accounts", ["Account", "State", "Needs attention", "Login", "Hours", "Used 24h", "Actions"]);
  const picker = document.querySelector("#shift-form [name=account]");
  const chosen = picker.value;
  picker.replaceChildren();
  const passwordPicker = document.querySelector("#password-form [name=account]");
  const passwordChosen = passwordPicker.value;
  passwordPicker.replaceChildren();
  for (const account of accounts) {
    picker.add(new Option(account.label, account.id));
    passwordPicker.add(new Option(account.label, account.id));
    const row = body.insertRow();
    cell(row, account.label + " (" + account.username + ")");
    cell(row, account.state);
    const attention = account.operator_attention;
    cell(row, attention ? JSON.stringify(attention) : account.attention_detail);
    const assignment = account.assignment;
    cell(row, assignment ? assignment.state + (assignment.detail ? ": " + assignment.detail : "") : "not assigned");
    cell(row, hours(account.schedule));
    cell(row, account.attempts_24h + " of " + account.max_attempts_24h);
    cell(row, assignment ? group(
      command(assignment, "verify"), command(assignment, "retry-login"),
      command(assignment, "confirm-replace"), command(assignment, "clear")) : "");
  }
  if (chosen) picker.value = chosen;
}

const RESULT = {
  linkedin_person: (request) => "/v1/linkedin-individual?url=" + encodeURIComponent(request.url),
  linkedin_company: (request) => "/v1/linkedin-company?url=" + encodeURIComponent(request.url),
  generic: (request) => "/v1/url/" + request.id,
  google_search: (request) => "/v1/google-search/" + request.id,
};

async function show(path) {
  const box = $("detail");
  box.textContent = JSON.stringify(await call("GET", path), null, 2);
  box.hidden = false;
}

function renderRequests(requests) {
  const body = table("requests", ["Requested", "Kind", "Target", "Status", "Waiting because", "Open"]);
  for (const request of requests) {
    const row = body.insertRow();
    cell(row, request.requested_at);
    cell(row, request.kind);
    cell(row, request.target);
    cell(row, request.status);
    cell(row, request.status === "queued" ? request.wait_reason : "");
    cell(row, group(
      button("Status", () => show("/v1/requests/" + request.id)),
      button("Result", () => show(RESULT[request.kind](request)))));
  }
}

async function refresh() {
  const data = await call("GET", "/console/api/overview");
  $("main").hidden = false;
  renderWorkers(data.workers, data.accounts);
  renderAccounts(data.accounts);
  renderRequests(data.requests);
}

$("key-form").addEventListener("submit", attempt(async (event) => {
  event.preventDefault();
  apiKey = $("key").value.trim();
  await refresh();
}));
$("refresh").addEventListener("click", attempt(refresh));

$("password-form").addEventListener("submit", attempt(async (event) => {
  event.preventDefault();
  const fields = Object.fromEntries(new FormData(event.target));
  await call("PUT", "/console/api/accounts/" + fields.account + "/password",
             { password: fields.password });
  event.target.reset();
  await refresh();
}));

$("account-form").addEventListener("submit", attempt(async (event) => {
  event.preventDefault();
  const fields = Object.fromEntries(new FormData(event.target));
  const body = { label: fields.label, username: fields.username, password: fields.password,
                 max_attempts_24h: Number(fields.max_attempts_24h),
                 min_interval_seconds: Number(fields.min_interval_seconds) };
  if (fields.profile_url) body.profile_url = fields.profile_url;
  await call("POST", "/console/api/accounts", body);
  event.target.reset();
  await refresh();
}));

$("shift-form").addEventListener("submit", attempt(async (event) => {
  event.preventDefault();
  const fields = Object.fromEntries(new FormData(event.target));
  const days = [1, 2, 3, 4, 5, 6, 7].map((weekday) => (weekday < 6 || fields.weekend)
    ? { weekday, working: true, start_local: fields.start, end_local: fields.end, lunch_minutes: Number(fields.lunch) }
    : { weekday, working: false });
  await call("PUT", "/console/api/accounts/" + fields.account + "/shift",
             { enabled: true, timezone: fields.timezone, days });
  await refresh();
}));

$("try-form").addEventListener("submit", attempt(async (event) => {
  event.preventDefault();
  const fields = Object.fromEntries(new FormData(event.target));
  const body = fields.kind === "google-search" ? { query: fields.target } : { url: fields.target };
  if (fields.kind.startsWith("linkedin-") && fields.sections.trim()) {
    body.linkedin_sections = fields.sections.split(",").map((item) => item.trim()).filter(Boolean);
  }
  await call("POST", "/v1/scrape/" + fields.kind, body);
  await refresh();
}));
</script>
</body>
</html>

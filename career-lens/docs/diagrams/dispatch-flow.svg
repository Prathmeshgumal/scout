<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-label="How the dispatcher picks a worker"><title>How the dispatcher picks a worker</title><style>
.bg{fill:#0d1117}.panel{fill:#151b23;stroke:#30363d}.card{fill:#1c2128;stroke:#3d444d}.hi{stroke:#e6edf3}
.t{fill:#e6edf3;font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.d{fill:#9198a1;font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.gt{fill:#e6edf3;font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.gs{fill:#9198a1;font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.h1{fill:#e6edf3;font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.h2{fill:#9198a1;font:400 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.lb{fill:#9198a1;font:400 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.lbg{fill:#0d1117}.life{stroke:#3d444d}
.s-blue{stroke:#4493f8}.f-blue{fill:#4493f8}.s-orange{stroke:#f0883e}.f-orange{fill:#f0883e}.s-purple{stroke:#a371f7}.f-purple{fill:#a371f7}.s-teal{stroke:#39c5cf}.f-teal{fill:#39c5cf}.s-green{stroke:#3fb950}.f-green{fill:#3fb950}.s-amber{stroke:#d29922}.f-amber{fill:#d29922}.s-grey{stroke:#9198a1}.f-grey{fill:#9198a1}.s-red{stroke:#f85149}.f-red{fill:#f85149}
@media (prefers-color-scheme: light){
.bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d1d9e0}.card{fill:#ffffff;stroke:#d1d9e0}.hi{stroke:#1f2328}
.t,.gt,.h1{fill:#1f2328}.d,.gs,.h2,.lb{fill:#59636e}.lbg{fill:#ffffff}.life{stroke:#d1d9e0}
.s-blue{stroke:#0969da}.f-blue{fill:#0969da}.s-orange{stroke:#bc4c00}.f-orange{fill:#bc4c00}.s-purple{stroke:#8250df}.f-purple{fill:#8250df}.s-teal{stroke:#1b7c83}.f-teal{fill:#1b7c83}.s-green{stroke:#1a7f37}.f-green{fill:#1a7f37}.s-amber{stroke:#9a6700}.f-amber{fill:#9a6700}.s-grey{stroke:#59636e}.f-grey{fill:#59636e}.s-red{stroke:#cf222e}.f-red{fill:#cf222e}}
</style><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-teal"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-amber"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker></defs><rect width="1120" height="620" rx="12" class="bg"/><text x="24" y="34" class="h1" text-anchor="start">How the dispatcher picks a worker</text><text x="24" y="54" class="h2" text-anchor="start">Each pass binds the oldest runnable request to a free browser.</text><rect x="40" y="90" width="210" height="56" rx="8" class="card" stroke-width="1"/><circle cx="58" cy="109" r="4" class="f-teal"/><text x="69" y="113" class="t" text-anchor="start">Queued request</text><text x="54" y="132" class="d" text-anchor="start">oldest runnable first</text><polygon points="380,76.0 465.0,118 380,160.0 295.0,118" class="card s-amber" stroke-width="1.6"/><text x="380" y="122" class="t" text-anchor="middle">What kind?</text><rect x="520" y="80" width="330" height="112" rx="8" class="card s-orange" stroke-width="1.6"/><text x="534" y="103" class="t" text-anchor="start">LinkedIn, signed in</text><text x="534" y="122" class="d" text-anchor="start">job search · posting · company jobs · person</text><text x="534" y="138" class="d" text-anchor="start">an account on a running worker</text><text x="534" y="154" class="d" text-anchor="start">inside the account&#x27;s shift today</text><text x="534" y="170" class="d" text-anchor="start">a pacing gap since its last visit · no cooldown</text><rect x="520" y="215" width="330" height="56" rx="8" class="card s-blue" stroke-width="1.6"/><text x="534" y="238" class="t" text-anchor="start">Google search</text><text x="534" y="257" class="d" text-anchor="start">a worker with Google budget left today</text><rect x="520" y="295" width="330" height="56" rx="8" class="card s-grey" stroke-width="1.6"/><text x="534" y="318" class="t" text-anchor="start">Public page</text><text x="534" y="337" class="d" text-anchor="start">any free worker</text><path d="M250,118 L295,118" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><path d="M465,118 L490,118 L490,136 L520,136" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><path d="M490,118 L490,243 L520,243" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><path d="M490,243 L490,323 L520,323" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><polygon points="975,188.0 1065.0,230 975,272.0 885.0,230" class="card s-amber" stroke-width="1.6"/><text x="975" y="234" class="t" text-anchor="middle">Eligible worker?</text><path d="M850,136 L870,136 L870,230 L885,230" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><path d="M850,243 L870,243" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><path d="M850,323 L870,323 L870,232" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><rect x="885" y="80" width="205" height="64" rx="8" class="card s-amber" stroke-width="1.6"/><text x="899" y="103" class="t" text-anchor="start">Wait</text><text x="899" y="122" class="d" text-anchor="start">the reason shows in the console</text><text x="899" y="138" class="d" text-anchor="start">tried again on the next pass</text><path d="M975,188 L975,144" fill="none" class="s-amber" stroke-width="1.5" marker-end="url(#a-amber)"/><rect x="985.0" y="161" width="21.0" height="15" rx="3" class="lbg"/><text x="990" y="172" class="lb" text-anchor="start">no</text><rect x="875" y="300" width="200" height="64" rx="8" class="card hi" stroke-width="1.6"/><text x="889" y="323" class="t" text-anchor="start">Claim and run</text><text x="889" y="342" class="d" text-anchor="start">claimed for 10 minutes</text><text x="889" y="358" class="d" text-anchor="start">real Chrome, paced</text><path d="M975,272 L975,300" fill="none" class="s-green" stroke-width="1.5" marker-end="url(#a-green)"/><rect x="985.0" y="279" width="26.5" height="15" rx="3" class="lbg"/><text x="990" y="290" class="lb" text-anchor="start">yes</text><polygon points="975,404.0 1060.0,446 975,488.0 890.0,446" class="card s-amber" stroke-width="1.6"/><text x="975" y="450" class="t" text-anchor="middle">Outcome?</text><path d="M975,364 L975,404" fill="none" class="s-grey" stroke-width="1.5" marker-end="url(#a-grey)"/><rect x="875" y="530" width="200" height="64" rx="8" class="card s-green" stroke-width="1.6"/><text x="889" y="553" class="t" text-anchor="start">Succeeded</text><text x="889" y="572" class="d" text-anchor="start">observation saved</text><text x="889" y="588" class="d" text-anchor="start">the caller reads the result</text><path d="M975,488 L975,530" fill="none" class="s-green" stroke-width="1.5" marker-end="url(#a-green)"/><rect x="985.0" y="505" width="21.0" height="15" rx="3" class="lbg"/><text x="990" y="516" class="lb" text-anchor="start">ok</text><rect x="470" y="406" width="330" height="80" rx="8" class="card s-red" stroke-width="1.6"/><text x="484" y="429" class="t" text-anchor="start">Blocked</text><text x="484" y="448" class="d" text-anchor="start">challenge or rate limit: cooldown 1 → 5 → 15 min</text><text x="484" y="464" class="d" text-anchor="start">sign-in needed: waits for you in the console</text><text x="484" y="480" class="d" text-anchor="start">then retry, and prefer an untried account</text><path d="M890,446 L800,446" fill="none" class="s-red" stroke-width="1.5" marker-end="url(#a-red)"/><rect x="820.8" y="429" width="48.5" height="15" rx="3" class="lbg"/><text x="845" y="440" class="lb" text-anchor="middle">blocked</text><path d="M470,446 L145,446 L145,146" fill="none" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-grey)"/><rect x="248.2" y="429" width="103.5" height="15" rx="3" class="lbg"/><text x="300" y="440" class="lb" text-anchor="middle">back to the queue</text><rect x="40" y="520" width="400" height="64" rx="8" class="card" stroke-width="1" stroke-dasharray="5 4"/><text x="54" y="543" class="t" text-anchor="start">Not found is final</text><text x="54" y="562" class="d" text-anchor="start">a page that does not exist is not retried</text><text x="54" y="578" class="d" text-anchor="start">a failed section says so; it is never empty data</text></svg>
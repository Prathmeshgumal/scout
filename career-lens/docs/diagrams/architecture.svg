<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="career-lens architecture"><title>career-lens architecture</title><style>
.bg{fill:#0d1117}.panel{fill:#151b23;stroke:#30363d}.card{fill:#1c2128;stroke:#3d444d}.hi{stroke:#e6edf3}
.t{fill:#e6edf3;font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.d{fill:#9198a1;font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.gt{fill:#e6edf3;font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.gs{fill:#9198a1;font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.h1{fill:#e6edf3;font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.h2{fill:#9198a1;font:400 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.lb{fill:#9198a1;font:400 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.lbg{fill:#0d1117}.life{stroke:#3d444d}
.s-blue{stroke:#4493f8}.f-blue{fill:#4493f8}.s-orange{stroke:#f0883e}.f-orange{fill:#f0883e}.s-purple{stroke:#a371f7}.f-purple{fill:#a371f7}.s-teal{stroke:#39c5cf}.f-teal{fill:#39c5cf}.s-green{stroke:#3fb950}.f-green{fill:#3fb950}.s-amber{stroke:#d29922}.f-amber{fill:#d29922}.s-grey{stroke:#9198a1}.f-grey{fill:#9198a1}.s-red{stroke:#f85149}.f-red{fill:#f85149}
@media (prefers-color-scheme: light){
.bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d1d9e0}.card{fill:#ffffff;stroke:#d1d9e0}.hi{stroke:#1f2328}
.t,.gt,.h1{fill:#1f2328}.d,.gs,.h2,.lb{fill:#59636e}.lbg{fill:#ffffff}.life{stroke:#d1d9e0}
.s-blue{stroke:#0969da}.f-blue{fill:#0969da}.s-orange{stroke:#bc4c00}.f-orange{fill:#bc4c00}.s-purple{stroke:#8250df}.f-purple{fill:#8250df}.s-teal{stroke:#1b7c83}.f-teal{fill:#1b7c83}.s-green{stroke:#1a7f37}.f-green{fill:#1a7f37}.s-amber{stroke:#9a6700}.f-amber{fill:#9a6700}.s-grey{stroke:#59636e}.f-grey{fill:#59636e}.s-red{stroke:#cf222e}.f-red{fill:#cf222e}}
</style><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-teal"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-amber"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker></defs><rect width="1140" height="640" rx="12" class="bg"/><text x="24" y="34" class="h1" text-anchor="start">career-lens inside</text><text x="24" y="54" class="h2" text-anchor="start">The API and the control loop run in Docker. The browsers run on your desktop.</text><rect x="30" y="80" width="210" height="300" rx="12" class="panel"/><circle cx="50" cy="101" r="4" class="f-blue"/><text x="60" y="105" class="gt">Callers</text><rect x="45" y="125" width="180" height="80" rx="8" class="card s-purple" stroke-width="1.6"/><text x="59" y="148" class="t" text-anchor="start">job-finder</text><text x="59" y="167" class="d" text-anchor="start">API key cl_v1.…</text><text x="59" y="183" class="d" text-anchor="start">token bucket: 120,</text><text x="59" y="199" class="d" text-anchor="start">then 2 calls each second</text><rect x="45" y="235" width="180" height="80" rx="8" class="card" stroke-width="1"/><circle cx="63" cy="254" r="4" class="f-blue"/><text x="74" y="258" class="t" text-anchor="start">Operator</text><text x="59" y="277" class="d" text-anchor="start">console · password</text><text x="59" y="293" class="d" text-anchor="start">accounts · workers</text><text x="59" y="309" class="d" text-anchor="start">requests · try it</text><rect x="270" y="80" width="380" height="530" rx="12" class="panel"/><circle cx="290" cy="101" r="4" class="f-teal"/><text x="300" y="105" class="gt">Docker Compose<tspan class="gs" dx="8">API · control · data</tspan></text><rect x="290" y="125" width="340" height="80" rx="8" class="card hi" stroke-width="1.6"/><text x="304" y="148" class="t" text-anchor="start">API</text><text x="304" y="167" class="d" text-anchor="start">/v1 for agents · /operator/api for the console</text><text x="304" y="183" class="d" text-anchor="start">serves the console · checks freshness</text><text x="304" y="199" class="d" text-anchor="start">queues new requests</text><rect x="290" y="235" width="340" height="80" rx="8" class="card" stroke-width="1"/><text x="304" y="258" class="t" text-anchor="start">Control</text><text x="304" y="277" class="d" text-anchor="start">dispatcher: oldest runnable request first</text><text x="304" y="293" class="d" text-anchor="start">recovery · expired claims · day plans</text><text x="304" y="309" class="d" text-anchor="start">a Procrastinate queue in Postgres</text><rect x="290" y="345" width="160" height="96" rx="8" class="card" stroke-width="1"/><text x="304" y="368" class="t" text-anchor="start">Postgres</text><text x="304" y="387" class="d" text-anchor="start">requests · attempts</text><text x="304" y="403" class="d" text-anchor="start">append-only history</text><text x="304" y="419" class="d" text-anchor="start">accounts · shifts</text><text x="304" y="435" class="d" text-anchor="start">the job queue</text><rect x="470" y="345" width="160" height="96" rx="8" class="card" stroke-width="1"/><text x="484" y="368" class="t" text-anchor="start">MinIO</text><text x="484" y="387" class="d" text-anchor="start">page captures</text><text x="484" y="403" class="d" text-anchor="start">screenshots</text><text x="484" y="419" class="d" text-anchor="start">run logs</text><rect x="290" y="500" width="340" height="80" rx="8" class="card" stroke-width="1" stroke-dasharray="5 4"/><text x="304" y="523" class="t" text-anchor="start">Freshness</text><text x="304" y="542" class="d" text-anchor="start">a fresh result in the history answers at once</text><text x="304" y="558" class="d" text-anchor="start">with no new scrape</text><text x="304" y="574" class="d" text-anchor="start">partial · absent · not_captured · failed</text><rect x="690" y="80" width="420" height="340" rx="12" class="panel"/><circle cx="710" cy="101" r="4" class="f-amber"/><text x="720" y="105" class="gt">Your desktop<tspan class="gs" dx="8">systemd user service career-lens-worker</tspan></text><rect x="710" y="125" width="380" height="64" rx="8" class="card" stroke-width="1"/><text x="724" y="148" class="t" text-anchor="start">Supervisor</text><text x="724" y="167" class="d" text-anchor="start">one per machine · starts one process per worker</text><text x="724" y="183" class="d" text-anchor="start">heartbeat · restarts a worker that stops</text><rect x="710" y="220" width="185" height="112" rx="8" class="card hi" stroke-width="1.6"/><text x="724" y="243" class="t" text-anchor="start">Worker A</text><text x="724" y="262" class="d" text-anchor="start">own Chrome profile</text><text x="724" y="278" class="d" text-anchor="start">LinkedIn account A</text><text x="724" y="294" class="d" text-anchor="start">signed in, in its shift</text><text x="724" y="310" class="d" text-anchor="start">one job at a time</text><rect x="905" y="220" width="185" height="112" rx="8" class="card hi" stroke-width="1.6"/><text x="919" y="243" class="t" text-anchor="start">Worker B</text><text x="919" y="262" class="d" text-anchor="start">own Chrome profile</text><text x="919" y="278" class="d" text-anchor="start">Google budget</text><text x="919" y="294" class="d" text-anchor="start">public pages</text><text x="919" y="310" class="d" text-anchor="start">one job at a time</text><rect x="690" y="470" width="420" height="140" rx="12" class="panel" stroke-dasharray="5 4"/><circle cx="710" cy="491" r="4" class="f-orange"/><text x="720" y="495" class="gt">The web</text><rect x="710" y="520" width="120" height="60" rx="8" class="card" stroke-width="1"/><text x="724" y="543" class="t" text-anchor="start">LinkedIn</text><text x="724" y="562" class="d" text-anchor="start">signed in</text><rect x="850" y="520" width="120" height="60" rx="8" class="card" stroke-width="1"/><text x="864" y="543" class="t" text-anchor="start">Google</text><text x="864" y="562" class="d" text-anchor="start">search</text><rect x="990" y="520" width="100" height="60" rx="8" class="card" stroke-width="1"/><text x="1004" y="543" class="t" text-anchor="start">Pages</text><text x="1004" y="562" class="d" text-anchor="start">public</text><path d="M225,160 L290,160" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><rect x="243.8" y="143" width="26.5" height="15" rx="3" class="lbg"/><text x="257" y="154" class="lb" text-anchor="middle">/v1</text><path d="M225,275 L255,275 L255,185 L290,185" fill="none" class="s-blue" stroke-width="1.5" marker-end="url(#a-blue)"/><rect x="230.8" y="225" width="48.5" height="15" rx="3" class="lbg"/><text x="255" y="236" class="lb" text-anchor="middle">console</text><path d="M460,205 L460,235" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><path d="M370,315 L370,345" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><path d="M630,275 L670,275 L670,250 L710,250" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><rect x="643.0" y="225" width="54.0" height="15" rx="3" class="lbg"/><text x="670" y="236" class="lb" text-anchor="middle">dispatch</text><path d="M710,300 L680,300 L680,460 L550,460 L550,441" fill="none" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-grey)"/><path d="M680,460 L370,460 L370,441" fill="none" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-grey)"/><rect x="560.5" y="465" width="109.0" height="15" rx="3" class="lbg"/><text x="615" y="476" class="lb" text-anchor="middle">results · captures</text><path d="M370,500 L370,476" fill="none" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-grey)"/><path d="M770,332 L770,520" fill="none" class="s-orange" stroke-width="1.5" marker-end="url(#a-orange)"/><rect x="751.2" y="439" width="37.5" height="15" rx="3" class="lbg"/><text x="770" y="450" class="lb" text-anchor="middle">paced</text><path d="M930,332 L930,520" fill="none" class="s-orange" stroke-width="1.5" marker-end="url(#a-orange)"/><path d="M1040,332 L1040,520" fill="none" class="s-orange" stroke-width="1.5" marker-end="url(#a-orange)"/></svg>
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LinkedIn Login Fixture</title>
</head>
<body>
  <section aria-hidden="true" style="display: none">
    <input id="ember-old-user" autocomplete="username">
    <input id="ember-old-password" type="password"
           autocomplete="current-password">
    <button id="ember-old-submit" type="button">Sign in</button>
  </section>

  <main>
    <label for="ember-current-user">Email or phone</label>
    <input id="ember-current-user" autocomplete="username">
    <label for="ember-current-password">Password</label>
    <input id="ember-current-password" type="password"
           autocomplete="current-password">
    <button id="ember-current-submit" type="button">Sign in</button>
  </main>
</body>
</html>

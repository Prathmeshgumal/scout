# The whole job search stack: career-lens (scraping) and job-finder (the agent and its web app).
#
#   docker compose up -d --build    start everything
#   docker compose ps               see what runs
#   docker compose logs -f jobfinder
#   docker compose down             stop, keeping all data (never add -v: it deletes the databases)
#
# Open http://127.0.0.1:8000 for job-finder and http://127.0.0.1:8090/console for the career-lens console.
#
# The native worker is not a container. It drives a headed Chrome with a signed-in profile, so it runs on
# this machine as a systemd user service. It starts when you log in and restarts after a crash:
#
#   systemctl --user status career-lens-worker
#   journalctl --user -u career-lens-worker -f
#
# First time only: systemctl --user enable --now ~/razorpay/jobscout/career-lens/deploy/career-lens-worker.service
#
# First start only:
#   1. ./stack-env.sh                                   puts the career-lens key and a new dashboard password
#                                                       in job-finder-config/.env
#   2. docker compose run --rm jobfinder job-finder login    saves your Claude login in ./job-finder-config
#
# The data volumes are the ones that the earlier separate stacks made, so nothing is lost.

name: jobsearch

x-career-lens-db: &career_lens_db postgresql+psycopg://career_lens_app:${CAREER_LENS_PG_PASSWORD:-career-lens-dev-secret}@careerlens-postgres:5432/career_lens

services:
  # --- career-lens -------------------------------------------------------------------------------------------
  careerlens-postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"   # the native worker connects here
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CAREER_LENS_PG_PASSWORD:-career-lens-dev-secret}
      POSTGRES_DB: career_lens
      CAREER_LENS_APP_DB_PASSWORD: ${CAREER_LENS_PG_PASSWORD:-career-lens-dev-secret}
      CAREER_LENS_MIGRATE_DB_PASSWORD: ${CAREER_LENS_PG_PASSWORD:-career-lens-dev-secret}
    volumes:
      - careerlens-postgres:/var/lib/postgresql/data
      - ./career-lens/deploy/postgres/bootstrap.sh:/docker-entrypoint-initdb.d/10-career-lens.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_lens"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  careerlens-minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    environment:
      MINIO_ROOT_USER: ${CAREER_LENS_MINIO_ROOT_USER:-career-lens-root}
      MINIO_ROOT_PASSWORD: ${CAREER_LENS_MINIO_ROOT_PASSWORD:-career-lens-root-dev-secret}
    volumes:
      - careerlens-minio:/data
    networks:
      default:
        aliases: [minio]   # the bucket script of career-lens uses this name
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  careerlens-bucket:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      careerlens-minio:
        condition: service_healthy
    environment:
      ROOT_USER: ${CAREER_LENS_MINIO_ROOT_USER:-career-lens-root}
      ROOT_PASSWORD: ${CAREER_LENS_MINIO_ROOT_PASSWORD:-career-lens-root-dev-secret}
      SERVICE_ACCESS_KEY: ${CAREER_LENS_S3_ACCESS_KEY:-career_lens}
      SERVICE_SECRET_KEY: ${CAREER_LENS_S3_SECRET_KEY:-career-lens-dev-secret}
      BUCKET: ${CAREER_LENS_S3_BUCKET:-career-lens}
    volumes:
      - ./career-lens/deploy/minio/bootstrap.sh:/bootstrap.sh:ro
      - ./career-lens/deploy/minio/artifact-policy.json:/artifact-policy.json.template:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]

  careerlens-migrate:
    build:
      context: ./career-lens
      dockerfile: Dockerfile.api
    image: career-lens:local
    depends_on:
      careerlens-postgres:
        condition: service_healthy
    environment:
      CAREER_LENS_MIGRATE_DATABASE_URL: postgresql+psycopg://career_lens_migrate:${CAREER_LENS_PG_PASSWORD:-career-lens-dev-secret}@careerlens-postgres:5432/career_lens
    command: ["career-lens", "migrate"]
    restart: "no"

  careerlens-api:
    image: career-lens:local
    depends_on:
      careerlens-migrate:
        condition: service_completed_successfully
      careerlens-minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"
    # The keys that encrypt the LinkedIn passwords. The values below replace the host addresses in that file.
    env_file:
      - path: ./career-lens/.env
        required: false
    environment:
      CAREER_LENS_DATABASE_URL: *career_lens_db
      CAREER_LENS_S3_ENDPOINT: http://careerlens-minio:9000
      CAREER_LENS_S3_PUBLIC_ENDPOINT: http://127.0.0.1:9002
      CAREER_LENS_S3_ACCESS_KEY: ${CAREER_LENS_S3_ACCESS_KEY:-career_lens}
      CAREER_LENS_S3_SECRET_KEY: ${CAREER_LENS_S3_SECRET_KEY:-career-lens-dev-secret}
      CAREER_LENS_S3_BUCKET: ${CAREER_LENS_S3_BUCKET:-career-lens}
      CAREER_LENS_MAX_ATTEMPTS: ${CAREER_LENS_MAX_ATTEMPTS:-3}
      CAREER_LENS_RATE_LIMIT_MAX_WAIT_SECONDS: ${CAREER_LENS_RATE_LIMIT_MAX_WAIT_SECONDS:-900}
      CAREER_LENS_ARTIFACT_URL_TTL_SECONDS: ${CAREER_LENS_ARTIFACT_URL_TTL_SECONDS:-604800}
    restart: unless-stopped

  careerlens-control:
    image: career-lens:local
    depends_on:
      careerlens-migrate:
        condition: service_completed_successfully
    environment:
      CAREER_LENS_DATABASE_URL: *career_lens_db
      CAREER_LENS_RETRY_HANDOFF_GRACE_SECONDS: ${CAREER_LENS_RETRY_HANDOFF_GRACE_SECONDS:-300}
    command: ["career-lens", "control"]
    restart: unless-stopped

  # --- job-finder --------------------------------------------------------------------------------------------
  jobfinder-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: jobfinder
      POSTGRES_DB: job_finder
    ports:
      - "127.0.0.1:55433:5432"   # for the tests and `uv run` outside Docker
    volumes:
      - jobfinder-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfinder -d job_finder"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  # The files that the user uploads. It makes the bucket on the first upload.
  jobfinder-minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9004:9000"   # for `uv run` outside Docker
      - "127.0.0.1:9005:9001"
    environment:
      MINIO_ROOT_USER: ${JOB_FINDER_S3_ACCESS_KEY:-jobfinder}
      MINIO_ROOT_PASSWORD: ${JOB_FINDER_S3_SECRET_KEY:-jobfinder-dev-secret}
    volumes:
      - jobfinder-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # The API and the UI on one port. It applies its database migrations when it starts.
  jobfinder:
    build: ./job-finder
    image: job-finder:local
    depends_on:
      jobfinder-postgres:
        condition: service_healthy
      jobfinder-minio:
        condition: service_healthy
      careerlens-api:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    # CAREER_LENS_API_KEY and JOB_FINDER_PASSWORD come only from /config/.env. Do not set them here: a value here, even an empty one, wins.
    # The Claude login (ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN) comes only from /config/.env,
    # which `job-finder login` writes. Do not set those two here: a value here, even an empty one, wins.
    environment:
      DATABASE_URL: postgresql://jobfinder:jobfinder@jobfinder-postgres:5432/job_finder
      CAREER_LENS_BASE_URL: http://careerlens-api:8080
      JOB_FINDER_S3_ENDPOINT: http://jobfinder-minio:9000
      JOB_FINDER_S3_ACCESS_KEY: ${JOB_FINDER_S3_ACCESS_KEY:-jobfinder}
      JOB_FINDER_S3_SECRET_KEY: ${JOB_FINDER_S3_SECRET_KEY:-jobfinder-dev-secret}
      JOB_FINDER_S3_BUCKET: job-finder
      CLAUDE_CONFIG_DIR: /data/claude
      JOB_FINDER_CWD: /data/agent
      JOB_FINDER_HOST: 0.0.0.0
      JOB_FINDER_ENV_FILE: /config/.env
      JOB_FINDER_SELF_RESTART: "1"       # a new Claude login from the web app restarts this container
    volumes:
      - jobfinder-state:/data            # Claude sessions: goals resume from them
      - ./job-finder-config:/config      # the env file that `job-finder login` keeps
    init: true                           # reaps the Claude CLI processes
    stop_grace_period: 30s               # running goals become interrupted and resume on the next start
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  # The volumes of the earlier separate stacks: the LinkedIn accounts, captures and goals stay.
  careerlens-postgres:
    external: true
    name: careerlens-v1_postgres-data
  careerlens-minio:
    external: true
    name: careerlens-v1_minio-data
  jobfinder-postgres:
    external: true
    name: jobfinder_pgdata
  jobfinder-state: {}
  jobfinder-minio: {}

name: jobfinder

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: jobfinder
      POSTGRES_DB: job_finder
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfinder -d job_finder"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  # The files that the user uploads
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9004:9000"
      - "127.0.0.1:9005:9001"
    environment:
      MINIO_ROOT_USER: jobfinder
      MINIO_ROOT_PASSWORD: jobfinder-dev-secret
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:

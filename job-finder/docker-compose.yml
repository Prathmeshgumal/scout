name: jobfinder

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: jobfinder
      POSTGRES_DB: job_finder
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfinder -d job_finder"]
      interval: 2s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:

[project]
name = "job-finder"
version = "0.1.0"
description = "A chat agent that finds jobs for one person, on the Claude Agent SDK and career-lens"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk>=0.2.165",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.14",
  "sqlalchemy>=2.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "prompt-toolkit>=3.0.43",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "tzdata>=2025.2",
]

[project.scripts]
job-finder = "job_finder.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.8", "playwright>=1.49"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

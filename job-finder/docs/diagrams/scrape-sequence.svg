aiting on 1 scrape”</text><path d="M692.5,276 L882.0,276" fill="none" class="s-orange" stroke-width="1.5" marker-end="url(#a-orange)"/><rect x="704.0" y="258" width="169.5" height="15" rx="3" class="lbg"/><text x="788.75" y="269" class="lb" text-anchor="middle">in the account&#x27;s shift, paced</text><path d="M500.0,310 L689.5,310" fill="none" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-grey)"/><rect x="517.0" y="292" width="158.5" height="15" rx="3" class="lbg"/><text x="596.25" y="303" class="lb" text-anchor="middle">poll the request every 10 s</text><path d="M692.5,344 L503.0,344" fill="none" class="s-teal" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-teal)"/><rect x="566.5" y="326" width="59.5" height="15" rx="3" class="lbg"/><text x="596.25" y="337" class="lb" text-anchor="middle">succeeded</text><path d="M500.0,378 L310.5,378" fill="none" class="s-grey" stroke-width="1.5" marker-end="url(#a-grey)"/><rect x="275.0" y="360" width="257.5" height="15" rx="3" class="lbg"/><text x="403.75" y="371" class="lb" text-anchor="middle">Scrapes finished for job-research (agentId …)</text><path d="M307.5,412 L118.0,412" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><rect x="101.8" y="394" width="219.0" height="15" rx="3" class="lbg"/><text x="211.25" y="405" class="lb" text-anchor="middle">SendMessage: continue with the results</text><path d="M115.0,446 L689.5,446" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><rect x="341.0" y="428" width="125.5" height="15" rx="3" class="lbg"/><text x="403.75" y="439" class="lb" text-anchor="middle">read the company jobs</text><path d="M115.0,480 L304.5,480" fill="none" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-grey)"/><rect x="126.5" y="462" width="169.5" height="15" rx="3" class="lbg"/><text x="211.25" y="473" class="lb" text-anchor="middle">{&quot;summary&quot;: &quot;12 roles saved&quot;}</text><r
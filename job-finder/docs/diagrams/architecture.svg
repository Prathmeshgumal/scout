<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="job-finder architecture"><title>job-finder architecture</title><style>
.bg{fill:#0d1117}.panel{fill:#151b23;stroke:#30363d}.card{fill:#1c2128;stroke:#3d444d}.hi{stroke:#e6edf3}
.t{fill:#e6edf3;font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.d{fill:#9198a1;font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.gt{fill:#e6edf3;font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.gs{fill:#9198a1;font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.h1{fill:#e6edf3;font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.h2{fill:#9198a1;font:400 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.lb{fill:#9198a1;font:400 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.lbg{fill:#0d1117}.life{stroke:#3d444d}
.s-blue{stroke:#4493f8}.f-blue{fill:#4493f8}.s-orange{stroke:#f0883e}.f-orange{fill:#f0883e}.s-purple{stroke:#a371f7}.f-purple{fill:#a371f7}.s-teal{stroke:#39c5cf}.f-teal{fill:#39c5cf}.s-green{stroke:#3fb950}.f-green{fill:#3fb950}.s-amber{stroke:#d29922}.f-amber{fill:#d29922}.s-grey{stroke:#9198a1}.f-grey{fill:#9198a1}.s-red{stroke:#f85149}.f-red{fill:#f85149}
@media (prefers-color-scheme: light){
.bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d1d9e0}.card{fill:#ffffff;stroke:#d1d9e0}.hi{stroke:#1f2328}
.t,.gt,.h1{fill:#1f2328}.d,.gs,.h2,.lb{fill:#59636e}.lbg{fill:#ffffff}.life{stroke:#d1d9e0}
.s-blue{stroke:#0969da}.f-blue{fill:#0969da}.s-orange{stroke:#bc4c00}.f-orange{fill:#bc4c00}.s-purple{stroke:#8250df}.f-purple{fill:#8250df}.s-teal{stroke:#1b7c83}.f-teal{fill:#1b7c83}.s-green{stroke:#1a7f37}.f-green{fill:#1a7f37}.s-amber{stroke:#9a6700}.f-amber{fill:#9a6700}.s-grey{stroke:#59636e}.f-grey{fill:#59636e}.s-red{stroke:#cf222e}.f-red{fill:#cf222e}}
</style><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-teal"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-amber"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker></defs><rect width="1100" height="640" rx="12" class="bg"/><text x="24" y="34" class="h1" text-anchor="start">job-finder inside</text><text x="24" y="54" class="h2" text-anchor="start">One process serves the web app, runs the agent team and records every step.</text><rect x="30" y="80" width="220" height="530" rx="12" class="panel"/><circle cx="50" cy="101" r="4" class="f-blue"/><text x="60" y="105" class="gt">Browser</text><rect x="45" y="125" width="190" height="160" rx="8" class="card" stroke-width="1"/><text x="59" y="148" class="t" text-anchor="start">Web app</text><text x="59" y="167" class="d" text-anchor="start">Chat · Jobs · Activity</text><text x="59" y="183" class="d" text-anchor="start">Job pipeline · All jobs</text><text x="59" y="199" class="d" text-anchor="start">Mandates</text><text x="59" y="215" class="d" text-anchor="start">React · Vite</text><text x="59" y="231" class="d" text-anchor="start">token from the sign-in</text><rect x="280" y="80" width="530" height="530" rx="12" class="panel"/><circle cx="300" cy="101" r="4" class="f-purple"/><text x="310" y="105" class="gt">job-finder server<tspan class="gs" dx="8">FastAPI · one process</tspan></text><rect x="300" y="125" width="230" height="80" rx="8" class="card" stroke-width="1"/><text x="314" y="148" class="t" text-anchor="start">API</text><text x="314" y="167" class="d" text-anchor="start">this computer only</text><text x="314" y="183" class="d" text-anchor="start">bearer token, 12 hours</text><text x="314" y="199" class="d" text-anchor="start">REST + live event stream</text><rect x="300" y="235" width="230" height="64" rx="8" class="card" stroke-width="1"/><text x="314" y="258" class="t" text-anchor="start">Event recorder</text><text x="314" y="277" class="d" text-anchor="start">every step goes to goal_events</text><text x="314" y="293" class="d" text-anchor="start">input and output of safe tools</text><rect x="560" y="125" width="230" height="80" rx="8" class="card hi" stroke-width="1.6"/><text x="574" y="148" class="t" text-anchor="start">Goal session</text><text x="574" y="167" class="d" text-anchor="start">one Claude Agent SDK client</text><text x="574" y="183" class="d" text-anchor="start">hooks: spend · time · scrapes</text><text x="574" y="199" class="d" text-anchor="start">one run of each subagent</text><rect x="560" y="235" width="230" height="112" rx="8" class="card s-purple" stroke-width="1.6"/><text x="574" y="258" class="t" text-anchor="start">Agent team</text><text x="574" y="277" class="d" text-anchor="start">main agent</text><text x="574" y="293" class="d" text-anchor="start">candidate-profile · job-discovery</text><text x="574" y="309" class="d" text-anchor="start">job-research · fit-check</text><text x="574" y="325" class="d" text-anchor="start">application-prep</text><rect x="560" y="377" width="230" height="80" rx="8" class="card" stroke-width="1"/><text x="574" y="400" class="t" text-anchor="start">MCP tool servers</text><text x="574" y="419" class="d" text-anchor="start">career_lens: search · read · scrape</text><text x="574" y="435" class="d" text-anchor="start">artifacts: save and read work</text><text x="574" y="451" class="d" text-anchor="start">one artifacts server per subagent</text><rect x="300" y="377" width="230" height="64" rx="8" class="card" stroke-width="1"/><text x="314" y="400" class="t" text-anchor="start">Page reader</text><text x="314" y="419" class="d" text-anchor="start">a small model answers</text><text x="314" y="435" class="d" text-anchor="start">a question from one page</text><rect x="300" y="487" width="230" height="80" rx="8" class="card" stroke-width="1" stroke-dasharray="5 4"/><text x="314" y="510" class="t" text-anchor="start">Watcher</text><text x="314" y="529" class="d" text-anchor="start">polls waiting scrapes every 10 s</text><text x="314" y="545" class="d" text-anchor="start">sends results to the main agent</text><text x="314" y="561" class="d" text-anchor="start">resumes a waiting goal</text><rect x="560" y="487" width="230" height="64" rx="8" class="card" stroke-width="1" stroke-dasharray="5 4"/><text x="574" y="510" class="t" text-anchor="start">Scheduler</text><text x="574" y="529" class="d" text-anchor="start">starts each mandate run</text><text x="574" y="545" class="d" text-anchor="start">at its time, in your time zone</text><rect x="850" y="125" width="220" height="56" rx="8" class="card" stroke-width="1"/><circle cx="868" cy="144" r="4" class="f-orange"/><text x="879" y="148" class="t" text-anchor="start">Claude</text><text x="864" y="167" class="d" text-anchor="start">the model behind each agent</text><rect x="850" y="235" width="220" height="80" rx="8" class="card s-teal" stroke-width="1.6"/><text x="864" y="258" class="t" text-anchor="start">career-lens</text><text x="864" y="277" class="d" text-anchor="start">/v1 · API key</text><text x="864" y="293" class="d" text-anchor="start">retries a 429 after Retry-After</text><rect x="850" y="377" width="220" height="80" rx="8" class="card" stroke-width="1"/><text x="864" y="400" class="t" text-anchor="start">Postgres</text><text x="864" y="419" class="d" text-anchor="start">goals · roles · verdicts</text><text x="864" y="435" class="d" text-anchor="start">events · scrapes · mandates</text><text x="864" y="451" class="d" text-anchor="start">job pipeline</text><rect x="850" y="487" width="220" height="64" rx="8" class="card" stroke-width="1"/><text x="864" y="510" class="t" text-anchor="start">MinIO</text><text x="864" y="529" class="d" text-anchor="start">resume · uploaded files</text><path d="M235,160 L300,160" fill="none" class="s-blue" stroke-width="1.5" marker-end="url(#a-blue)"/><rect x="251.0" y="143" width="32.0" height="15" rx="3" class="lbg"/><text x="267" y="154" class="lb" text-anchor="middle">REST</text><path d="M300,267 L235,267" fill="none" class="s-green" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-green)"/><rect x="253.8" y="250" width="26.5" height="15" rx="3" class="lbg"/><text x="267" y="261" class="lb" text-anchor="middle">SSE</text><path d="M530,165 L560,165" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><path d="M675,205 L675,235" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><path d="M560,280 L530,280" fill="none" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-grey)"/><path d="M790,150 L850,150" fill="none" class="s-orange" stroke-width="1.5" marker-end="url(#a-orange)"/><rect x="801.2" y="133" width="37.5" height="15" rx="3" class="lbg"/><text x="820" y="144" class="lb" text-anchor="middle">think</text><path d="M675,347 L675,377" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><path d="M560,409 L530,409" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><rect x="515.2" y="416" width="59.5" height="15" rx="3" class="lbg"/><text x="545" y="427" class="lb" text-anchor="middle">read_page</text><path d="M790,400 L820,400 L820,275 L850,275" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><rect x="806.8" y="329" width="26.5" height="15" rx="3" class="lbg"/><text x="820" y="340" class="lb" text-anchor="middle">/v1</text><path d="M790,430 L850,430" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><rect x="790.2" y="435" width="59.5" height="15" rx="3" class="lbg"/><text x="820" y="446" class="lb" text-anchor="middle">save work</text><path d="M790,447 L832,447 L832,519 L850,519" fill="none" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-grey)"/><rect x="789.2" y="489" width="37.5" height="15" rx="3" class="lbg"/><text x="808" y="500" class="lb" text-anchor="middle">files</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="How the agent team works"><title>How the agent team works</title><style>
.bg{fill:#0d1117}.panel{fill:#151b23;stroke:#30363d}.card{fill:#1c2128;stroke:#3d444d}.hi{stroke:#e6edf3}
.t{fill:#e6edf3;font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.d{fill:#9198a1;font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.gt{fill:#e6edf3;font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.gs{fill:#9198a1;font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.h1{fill:#e6edf3;font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.h2{fill:#9198a1;font:400 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.lb{fill:#9198a1;font:400 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.lbg{fill:#0d1117}.life{stroke:#3d444d}
.s-blue{stroke:#4493f8}.f-blue{fill:#4493f8}.s-orange{stroke:#f0883e}.f-orange{fill:#f0883e}.s-purple{stroke:#a371f7}.f-purple{fill:#a371f7}.s-teal{stroke:#39c5cf}.f-teal{fill:#39c5cf}.s-green{stroke:#3fb950}.f-green{fill:#3fb950}.s-amber{stroke:#d29922}.f-amber{fill:#d29922}.s-grey{stroke:#9198a1}.f-grey{fill:#9198a1}.s-red{stroke:#f85149}.f-red{fill:#f85149}
@media (prefers-color-scheme: light){
.bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d1d9e0}.card{fill:#ffffff;stroke:#d1d9e0}.hi{stroke:#1f2328}
.t,.gt,.h1{fill:#1f2328}.d,.gs,.h2,.lb{fill:#59636e}.lbg{fill:#ffffff}.life{stroke:#d1d9e0}
.s-blue{stroke:#0969da}.f-blue{fill:#0969da}.s-orange{stroke:#bc4c00}.f-orange{fill:#bc4c00}.s-purple{stroke:#8250df}.f-purple{fill:#8250df}.s-teal{stroke:#1b7c83}.f-teal{fill:#1b7c83}.s-green{stroke:#1a7f37}.f-green{fill:#1a7f37}.s-amber{stroke:#9a6700}.f-amber{fill:#9a6700}.s-grey{stroke:#59636e}.f-grey{fill:#59636e}.s-red{stroke:#cf222e}.f-red{fill:#cf222e}}
</style><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-teal"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-amber"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker></defs><rect width="1100" height="640" rx="12" class="bg"/><text x="24" y="34" class="h1" text-anchor="start">How the agent team works</text><text x="24" y="54" class="h2" text-anchor="start">The main agent plans. Each subagent does one kind of work and saves it.</text><rect x="40" y="90" width="170" height="56" rx="8" class="card" stroke-width="1"/><circle cx="58" cy="109" r="4" class="f-blue"/><text x="69" y="113" class="t" text-anchor="start">Your message</text><text x="54" y="132" class="d" text-anchor="start">the roles you want</text><rect x="250" y="86" width="210" height="64" rx="8" class="card s-purple" stroke-width="1.6"/><text x="264" y="109" class="t" text-anchor="start">candidate-profile</text><text x="264" y="128" class="d" text-anchor="start">builds the profile from</text><text x="264" y="144" class="d" text-anchor="start">your words and your resume</text><polygon points="570,76.0 650.0,118 570,160.0 490.0,118" class="card s-amber" stroke-width="1.6"/><text x="570" y="114" class="t" text-anchor="middle">Profile ready?</text><text x="570" y="130" class="d" text-anchor="middle">titles and places</text><rect x="690" y="86" width="220" height="64" rx="8" class="card" stroke-width="1"/><text x="704" y="109" class="t" text-anchor="start">set_brief</text><text x="704" y="128" class="d" text-anchor="start">title · criteria</text><text x="704" y="144" class="d" text-anchor="start">number of fit roles (default 10)</text><rect x="490" y="196" width="160" height="50" rx="8" class="card s-blue" stroke-width="1.6"/><text x="504" y="219" class="t" text-anchor="start">Ask you</text><text x="504" y="238" class="d" text-anchor="start">titles or places</text><path d="M210,118 L250,118" fill="none" class="s-blue" stroke-width="1.5" marker-end="url(#a-blue)"/><path d="M460,118 L490,118" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><path d="M650,118 L690,118" fill="none" class="s-green" stroke-width="1.5" marker-end="url(#a-green)"/><rect x="656.8" y="101" width="26.5" height="15" rx="3" class="lbg"/><text x="670" y="112" class="lb" text-anchor="middle">yes</text><path d="M570,160 L570,196" fill="none" class="s-amber" stroke-width="1.5" marker-end="url(#a-amber)"/><rect x="581.0" y="171" width="21.0" height="15" rx="3" class="lbg"/><text x="586" y="182" class="lb" text-anchor="start">no</text><path d="M490,221 L125,221 L125,146" fill="none" class="s-blue" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-blue)"/><rect x="267.5" y="214" width="65.0" height="15" rx="3" class="lbg"/><text x="300" y="225" class="lb" text-anchor="middle">you answer</text><rect x="30" y="282" width="1040" height="128" rx="12" class="panel"/><circle cx="50" cy="303" r="4" class="f-purple"/><text x="60" y="307" class="gt">One round<tspan class="gs" dx="8">rounds overlap: research starts while the next discovery runs</tspan></text><rect x="50" y="322" width="235" height="64" rx="8" class="card s-purple" stroke-width="1.6"/><text x="64" y="345" class="t" text-anchor="start">job-discovery</text><text x="64" y="364" class="d" text-anchor="start">LinkedIn job search · Google</text><text x="64" y="380" class="d" text-anchor="start">a new direction each round</text><rect x="305" y="322" width="235" height="64" rx="8" class="card s-purple" stroke-width="1.6"/><text x="319" y="345" class="t" text-anchor="start">job-research</text><text x="319" y="364" class="d" text-anchor="start">full job text · company facts</text><text x="319" y="380" class="d" text-anchor="start">company job lists</text><path d="M285,354 L305,354" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><rect x="560" y="322" width="235" height="64" rx="8" class="card s-purple" stroke-width="1.6"/><text x="574" y="345" class="t" text-anchor="start">fit-check</text><text x="574" y="364" class="d" text-anchor="start">fit · partial · not_fit · unsure</text><text x="574" y="380" class="d" text-anchor="start">with the reasons</text><path d="M540,354 L560,354" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><rect x="815" y="322" width="235" height="64" rx="8" class="card s-purple" stroke-width="1.6"/><text x="829" y="345" class="t" text-anchor="start">application-prep</text><text x="829" y="364" class="d" text-anchor="start">a note for each fit role</text><text x="829" y="380" class="d" text-anchor="start">it sends nothing</text><path d="M795,354 L815,354" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><path d="M800,150 L800,262 L167,262 L167,322" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><rect x="461.2" y="255" width="37.5" height="15" rx="3" class="lbg"/><text x="480" y="266" class="lb" text-anchor="middle">start</text><polygon points="932,434.0 1027.0,478 932,522.0 837.0,478" class="card s-amber" stroke-width="1.6"/><text x="932" y="474" class="t" text-anchor="middle">Enough fit roles?</text><text x="932" y="490" class="d" text-anchor="middle">fit ≥ the target</text><path d="M932,386 L932,434" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><rect x="832" y="560" width="200" height="56" rx="8" class="card s-green" stroke-width="1.6"/><text x="846" y="583" class="t" text-anchor="start">finish_goal</text><text x="846" y="602" class="d" text-anchor="start">report on the Jobs page</text><path d="M932,522 L932,560" fill="none" class="s-green" stroke-width="1.5" marker-end="url(#a-green)"/><rect x="941.0" y="535" width="26.5" height="15" rx="3" class="lbg"/><text x="946" y="546" class="lb" text-anchor="start">yes</text><polygon points="620,434.0 715.0,478 620,522.0 525.0,478" class="card s-amber" stroke-width="1.6"/><text x="620" y="474" class="t" text-anchor="middle">A limit reached?</text><text x="620" y="490" class="d" text-anchor="middle">spend · time · scrapes</text><path d="M837,478 L715,478" fill="none" class="s-amber" stroke-width="1.5" marker-end="url(#a-amber)"/><rect x="765.5" y="461" width="21.0" height="15" rx="3" class="lbg"/><text x="776" y="472" class="lb" text-anchor="middle">no</text><rect x="520" y="560" width="200" height="56" rx="8" class="card s-amber" stroke-width="1.6"/><text x="534" y="583" class="t" text-anchor="start">Wrap-up answer</text><text x="534" y="602" class="d" text-anchor="start">the best report from what it has</text><path d="M620,522 L620,560" fill="none" class="s-amber" stroke-width="1.5" marker-end="url(#a-amber)"/><rect x="629.0" y="535" width="26.5" height="15" rx="3" class="lbg"/><text x="634" y="546" class="lb" text-anchor="start">yes</text><path d="M525,478 L167,478 L167,386" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><rect x="255.2" y="461" width="169.5" height="15" rx="3" class="lbg"/><text x="340" y="472" class="lb" text-anchor="middle">no: next round, new direction</text><rect x="40" y="525" width="420" height="80" rx="8" class="card" stroke-width="1" stroke-dasharray="5 4"/><text x="54" y="548" class="t" text-anchor="start">Rules the code enforces</text><text x="54" y="567" class="d" text-anchor="start">candidate-profile runs first; the others wait for it</text><text x="54" y="583" class="d" text-anchor="start">one run of each subagent at a time</text><text x="54" y="599" class="d" text-anchor="start">only fit roles count toward the target</text></svg>
rch</text><path d="M662.5,276 L842.0,276" fill="none" class="s-orange" stroke-width="1.5" marker-end="url(#a-orange)"/><rect x="669.0" y="258" width="169.5" height="15" rx="3" class="lbg"/><text x="753.75" y="269" class="lb" text-anchor="middle">real Chrome, signed in, paced</text><path d="M662.5,310 L483.0,310" fill="none" class="s-teal" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-teal)"/><rect x="453.5" y="292" width="235.5" height="15" rx="3" class="lbg"/><text x="571.25" y="303" class="lb" text-anchor="middle">roles (now, or later through the watcher)</text><path d="M480.0,344 L300.5,344" fill="none" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-grey)"/><rect x="309.5" y="326" width="158.5" height="15" rx="3" class="lbg"/><text x="388.75" y="337" class="lb" text-anchor="middle">{&quot;summary&quot;: &quot;10 new roles&quot;}</text><path d="M297.5,378 L477.0,378" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><rect x="282.0" y="360" width="213.5" height="15" rx="3" class="lbg"/><text x="388.75" y="371" class="lb" text-anchor="middle">job-research: read the full job texts</text><path d="M480.0,412 L659.5,412" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><rect x="459.0" y="394" width="224.5" height="15" rx="3" class="lbg"/><text x="571.25" y="405" class="lb" text-anchor="middle">read job · company jobs · company facts</text><path d="M297.5,446 L477.0,446" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><rect x="295.8" y="428" width="186.0" height="15" rx="3" class="lbg"/><text x="388.75" y="439" class="lb" text-anchor="middle">fit-check, then application-prep</text><rect x="229.04999999999998" y="466" width="501.90000000000003" height="20" rx="10" class="card s-amber" stroke-dasharray="4 3"/><text x="480.0" y="480" class="d" text-anchor="middle">repeat discovery → research → fit-check until 20 roles fit, or a limit is reached</text><
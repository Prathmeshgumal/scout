<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="jobscout architecture"><title>jobscout architecture</title><style>
.bg{fill:#0d1117}.panel{fill:#151b23;stroke:#30363d}.card{fill:#1c2128;stroke:#3d444d}.hi{stroke:#e6edf3}
.t{fill:#e6edf3;font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.d{fill:#9198a1;font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.gt{fill:#e6edf3;font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.gs{fill:#9198a1;font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.h1{fill:#e6edf3;font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.h2{fill:#9198a1;font:400 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.lb{fill:#9198a1;font:400 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.lbg{fill:#0d1117}.life{stroke:#3d444d}
.s-blue{stroke:#4493f8}.f-blue{fill:#4493f8}.s-orange{stroke:#f0883e}.f-orange{fill:#f0883e}.s-purple{stroke:#a371f7}.f-purple{fill:#a371f7}.s-teal{stroke:#39c5cf}.f-teal{fill:#39c5cf}.s-green{stroke:#3fb950}.f-green{fill:#3fb950}.s-amber{stroke:#d29922}.f-amber{fill:#d29922}.s-grey{stroke:#9198a1}.f-grey{fill:#9198a1}.s-red{stroke:#f85149}.f-red{fill:#f85149}
@media (prefers-color-scheme: light){
.bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d1d9e0}.card{fill:#ffffff;stroke:#d1d9e0}.hi{stroke:#1f2328}
.t,.gt,.h1{fill:#1f2328}.d,.gs,.h2,.lb{fill:#59636e}.lbg{fill:#ffffff}.life{stroke:#d1d9e0}
.s-blue{stroke:#0969da}.f-blue{fill:#0969da}.s-orange{stroke:#bc4c00}.f-orange{fill:#bc4c00}.s-purple{stroke:#8250df}.f-purple{fill:#8250df}.s-teal{stroke:#1b7c83}.f-teal{fill:#1b7c83}.s-green{stroke:#1a7f37}.f-green{fill:#1a7f37}.s-amber{stroke:#9a6700}.f-amber{fill:#9a6700}.s-grey{stroke:#59636e}.f-grey{fill:#59636e}.s-red{stroke:#cf222e}.f-red{fill:#cf222e}}
</style><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-blue"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-orange"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-purple"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-teal"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-amber"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-grey"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-red"/></marker></defs><rect width="1140" height="640" rx="12" class="bg"/><text x="24" y="34" class="h1" text-anchor="start">How jobscout works</text><text x="24" y="54" class="h2" text-anchor="start">job-finder is the agent you talk to. career-lens gets it the data that a plain search cannot.</text><rect x="230" y="70" width="220" height="56" rx="8" class="card" stroke-width="1"/><circle cx="248" cy="89" r="4" class="f-blue"/><text x="259" y="93" class="t" text-anchor="start">You</text><text x="244" y="112" class="d" text-anchor="start">chat, review roles, track applications</text><rect x="560" y="70" width="230" height="56" rx="8" class="card" stroke-width="1"/><circle cx="578" cy="89" r="4" class="f-orange"/><text x="589" y="93" class="t" text-anchor="start">Claude</text><text x="574" y="112" class="d" text-anchor="start">Agent SDK · your Claude login</text><line x1="850" y1="84" x2="876" y2="84" class="s-blue" stroke-width="1.5"/><text x="884" y="88" class="lb" text-anchor="start">your actions</text><line x1="850" y1="102" x2="876" y2="102" class="s-purple" stroke-width="1.5"/><text x="884" y="106" class="lb" text-anchor="start">agent work</text><line x1="850" y1="120" x2="876" y2="120" class="s-teal" stroke-width="1.5"/><text x="884" y="124" class="lb" text-anchor="start">career-lens work</text><line x1="850" y1="138" x2="876" y2="138" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4"/><text x="884" y="142" class="lb" text-anchor="start">async: wait, poll, resume</text><rect x="30" y="160" width="420" height="450" rx="12" class="panel"/><circle cx="50" cy="181" r="4" class="f-purple"/><text x="60" y="185" class="gt">job-finder<tspan class="gs" dx="8">the agent that finds and tracks jobs</tspan></text><rect x="50" y="205" width="380" height="64" rx="8" class="card" stroke-width="1"/><text x="64" y="228" class="t" text-anchor="start">Web app</text><text x="64" y="247" class="d" text-anchor="start">chat · jobs · job pipeline · activity log</text><text x="64" y="263" class="d" text-anchor="start">React · live events over SSE</text><rect x="50" y="305" width="380" height="80" rx="8" class="card hi" stroke-width="1.6"/><text x="64" y="328" class="t" text-anchor="start">Agent team</text><text x="64" y="347" class="d" text-anchor="start">main agent plans and gives tasks to 5 subagents</text><text x="64" y="363" class="d" text-anchor="start">profile · discovery · research · fit-check · prep</text><text x="64" y="379" class="d" text-anchor="start">hooks enforce spend, time and scrape limits</text><rect x="50" y="420" width="380" height="64" rx="8" class="card" stroke-width="1"/><text x="64" y="443" class="t" text-anchor="start">Postgres + MinIO</text><text x="64" y="462" class="d" text-anchor="start">goals · roles · verdicts · notes · events · files</text><rect x="50" y="520" width="380" height="64" rx="8" class="card" stroke-width="1" stroke-dasharray="5 4"/><text x="64" y="543" class="t" text-anchor="start">Watcher and scheduler</text><text x="64" y="562" class="d" text-anchor="start">waits on slow scrapes, then resumes the agent</text><text x="64" y="578" class="d" text-anchor="start">starts mandates on their schedule</text><rect x="560" y="160" width="360" height="450" rx="12" class="panel"/><circle cx="580" cy="181" r="4" class="f-teal"/><text x="590" y="185" class="gt">career-lens<tspan class="gs" dx="8">data tools for the agent</tspan></text><rect x="580" y="205" width="320" height="64" rx="8" class="card" stroke-width="1"/><text x="594" y="228" class="t" text-anchor="start">API</text><text x="594" y="247" class="d" text-anchor="start">/v1 for agents · API key · rate limit</text><text x="594" y="263" class="d" text-anchor="start">console for the operator</text><rect x="580" y="305" width="320" height="64" rx="8" class="card" stroke-width="1"/><text x="594" y="328" class="t" text-anchor="start">Control</text><text x="594" y="347" class="d" text-anchor="start">dispatcher · retries · cooldowns</text><text x="594" y="363" class="d" text-anchor="start">account shifts and day plans</text><rect x="580" y="405" width="320" height="80" rx="8" class="card hi" stroke-width="1.6"/><text x="594" y="428" class="t" text-anchor="start">Native workers</text><text x="594" y="447" class="d" text-anchor="start">a real Chrome on your machine</text><text x="594" y="463" class="d" text-anchor="start">signed-in LinkedIn accounts</text><text x="594" y="479" class="d" text-anchor="start">paced like a person</text><rect x="580" y="520" width="320" height="64" rx="8" class="card" stroke-width="1"/><text x="594" y="543" class="t" text-anchor="start">Postgres + MinIO</text><text x="594" y="562" class="d" text-anchor="start">requests · append-only history · captures</text><rect x="950" y="160" width="170" height="450" rx="12" class="panel" stroke-dasharray="5 4"/><circle cx="970" cy="181" r="4" class="f-orange"/><text x="980" y="185" class="gt">The web</text><rect x="965" y="300" width="140" height="64" rx="8" class="card" stroke-width="1"/><text x="979" y="323" class="t" text-anchor="start">LinkedIn</text><text x="979" y="342" class="d" text-anchor="start">job search · postings</text><text x="979" y="358" class="d" text-anchor="start">company jobs</text><rect x="965" y="395" width="140" height="50" rx="8" class="card" stroke-width="1"/><text x="979" y="418" class="t" text-anchor="start">Google</text><text x="979" y="437" class="d" text-anchor="start">search results</text><rect x="965" y="475" width="140" height="50" rx="8" class="card" stroke-width="1"/><text x="979" y="498" class="t" text-anchor="start">Career pages</text><text x="979" y="517" class="d" text-anchor="start">any public page</text><path d="M380,126 L380,205" fill="none" class="s-blue" stroke-width="1.5" marker-end="url(#a-blue)"/><rect x="342.0" y="139" width="76.0" height="15" rx="3" class="lbg"/><text x="380" y="150" class="lb" text-anchor="middle">your message</text><path d="M200,269 L200,305" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><path d="M280,305 L280,269" fill="none" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-grey)"/><rect x="182.8" y="280" width="114.5" height="15" rx="3" class="lbg"/><text x="240" y="291" class="lb" text-anchor="middle">tasks · live events</text><path d="M240,385 L240,420" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><rect x="207.5" y="395" width="65.0" height="15" rx="3" class="lbg"/><text x="240" y="406" class="lb" text-anchor="middle">saves work</text><path d="M430,330 L470,330 L470,98 L560,98" fill="none" class="s-orange" stroke-width="1.5" marker-end="url(#a-orange)"/><rect x="496.2" y="81" width="37.5" height="15" rx="3" class="lbg"/><text x="515" y="92" class="lb" text-anchor="middle">think</text><path d="M430,355 L490,355 L490,230 L580,230" fill="none" class="s-purple" stroke-width="1.5" marker-end="url(#a-purple)"/><rect x="483.2" y="213" width="103.5" height="15" rx="3" class="lbg"/><text x="535" y="224" class="lb" text-anchor="middle">search · read job</text><path d="M430,552 L510,552 L510,255 L580,255" fill="none" class="s-grey" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-grey)"/><rect x="529.0" y="239" width="32.0" height="15" rx="3" class="lbg"/><text x="545" y="250" class="lb" text-anchor="middle">poll</text><path d="M740,269 L740,305" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><rect x="721.2" y="280" width="37.5" height="15" rx="3" class="lbg"/><text x="740" y="291" class="lb" text-anchor="middle">queue</text><path d="M740,369 L740,405" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><rect x="718.5" y="380" width="43.0" height="15" rx="3" class="lbg"/><text x="740" y="391" class="lb" text-anchor="middle">assign</text><path d="M740,485 L740,520" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><rect x="718.5" y="495" width="43.0" height="15" rx="3" class="lbg"/><text x="740" y="506" class="lb" text-anchor="middle">result</text><path d="M900,430 L930,430 L930,332 L965,332" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><rect x="900.2" y="369" width="59.5" height="15" rx="3" class="lbg"/><text x="930" y="380" class="lb" text-anchor="middle">signed in</text><path d="M900,445 L945,445 L945,420 L965,420" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/><path d="M900,460 L945,460 L945,500 L965,500" fill="none" class="s-teal" stroke-width="1.5" marker-end="url(#a-teal)"/></svg>